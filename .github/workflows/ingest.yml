name: Ingest extreme weather data

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keepalive step re-enables this workflow

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run ingestion
        working-directory: ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python run.py

      # GitHub disables scheduled workflows after 60 days without a commit.
      # Re-enabling via the API resets that clock, so a quiet repo keeps
      # ingesting. Runs even if ingestion failed.
      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable ingest.yml --repo "${{ github.repository }}" || true
